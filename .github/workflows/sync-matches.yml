# Imports upcoming Premier League and international cricket fixtures, posts results for
# finished matches and settles contests. Runs hourly; can also be run from the Actions tab.
name: Sync matches

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would happen
        type: boolean
        default: false
      force_cricket_list:
        description: Refresh the cricket fixture list now (uses CricketData requests)
        type: boolean
        default: false
      preview_fpl_fixture:
        description: 'Only score this finished FPL fixture (an id, or "latest") and print the top players'
        default: ""

concurrency: hedera-testnet

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      # Match metadata already read from HCS, so each run doesn't re-download it
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sync-cache-${{ github.run_id }}
          restore-keys: sync-cache-
      - name: Sync
        # Hashio often answers the chain-id call with HTTP 502. That is not a bad sync.
        # Retry twice. A scheduled run that still cannot reach the RPC exits 0 so it does not mail a failure.
        # A manual run still fails, so a real script error is visible from the Actions tab.
        run: |
          set +e
          attempt=1
          while [ "$attempt" -le 3 ]; do
            npx hardhat run scripts/sync.js --network hederaTestnet
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            echo "sync attempt ${attempt} exited ${code}"
            attempt=$((attempt + 1))
            sleep 20
          done
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::warning::Hashio was unreachable after 3 attempts. Skipping this hour."
            exit 0
          fi
          exit "$code"
        env:
          HEDERA_ACCOUNT_ID: ${{ secrets.HEDERA_ACCOUNT_ID }}
          HEDERA_PRIVATE_KEY: ${{ secrets.HEDERA_PRIVATE_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_CRICKET_LIST: ${{ inputs.force_cricket_list && '1' || '' }}
          PREVIEW_FPL_FIXTURE: ${{ inputs.preview_fpl_fixture }}
