# Imports upcoming Premier League and international cricket fixtures, posts results for
# finished matches and settles contests. Runs hourly; can also be run from the Actions tab.
name: Sync matches

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would happen
        type: boolean
        default: false
      force_cricket_list:
        description: Refresh the cricket fixture list now (uses CricketData requests)
        type: boolean
        default: false
      preview_fpl_fixture:
        description: 'Only score this finished FPL fixture (an id, or "latest") and print the top players'
        default: ""

concurrency: hedera-testnet

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      # Match metadata already read from HCS, so each run doesn't re-download it
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sync-cache-${{ github.run_id }}
          restore-keys: sync-cache-
      - name: Sync
        # Hashio (https://testnet.hashio.io/api) is the free public relay and often answers
        # the chain-id call with HTTP 502. thirdweb publishes the other keyless testnet relay.
        # Use the first one that returns chain id 296 (0x128). Do not hide a real script error.
        run: |
          set +e
          probe() {
            curl -sf --max-time 20 -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$1" \
              | grep -Eq '"result"[[:space:]]*:[[:space:]]*"0x128"'
          }
          code=1
          for url in https://testnet.hashio.io/api https://296.rpc.thirdweb.com; do
            ready=1
            for try in 1 2 3; do
              if probe "$url"; then
                ready=0
                break
              fi
              echo "$url did not return chain id 296 (try ${try})"
              sleep 15
            done
            if [ "$ready" -ne 0 ]; then
              continue
            fi
            echo "Sync via ${url}"
            HEDERA_RPC_URL="$url" npx hardhat run scripts/sync.js --network hederaTestnet
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            echo "sync via ${url} exited ${code}"
          done
          echo "::error::No Hedera testnet relay completed the sync (last exit ${code})."
          exit "$code"
        env:
          HEDERA_ACCOUNT_ID: ${{ secrets.HEDERA_ACCOUNT_ID }}
          HEDERA_PRIVATE_KEY: ${{ secrets.HEDERA_PRIVATE_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_CRICKET_LIST: ${{ inputs.force_cricket_list && '1' || '' }}
          PREVIEW_FPL_FIXTURE: ${{ inputs.preview_fpl_fixture }}
